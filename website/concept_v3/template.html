<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCENTRO — Concept v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== SCENTRO identity: black · ivory · gold, classic serif (matches the wordmark) ===== */
:root{
  --ivory:#FAF6EE; --sand:#EFE7D8; --paper:#FFFFFF; --ink:#141210; --black:#0E0C0A; --black2:#17130F;
  --mute:#6F655A; --line:rgba(20,18,16,.13); --gold:#B8924F; --gold-l:#E2C27D; --gold-d:#8C6A2F;
  --goldline:linear-gradient(90deg,transparent,#B8924F 18%,#E2C27D 50%,#B8924F 82%,transparent);
  --serif:'Cormorant Garamond','Amiri',serif; --sans:'Inter','IBM Plex Sans Arabic',system-ui,sans-serif; --r:3px;
}
:root[dir=rtl]{--serif:'Amiri','Cormorant Garamond',serif;--sans:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--ivory);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-inline:clamp(20px,4vw,56px)}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-d);font-weight:500}
:root[dir=rtl] .eyebrow{letter-spacing:.02em;font-size:13.5px;text-transform:none}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--ink);line-height:1.08;text-wrap:balance}
h2{font-size:clamp(32px,3.6vw,48px)}:root[dir=rtl] h1,:root[dir=rtl] h2,:root[dir=rtl] h3{line-height:1.3}
.rule{height:1px;background:var(--goldline);border:0;width:96px;margin:18px 0}
.sec{padding-block:clamp(56px,8vw,104px)}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:36px;flex-wrap:wrap}
.link{font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--gold);padding-bottom:3px;white-space:nowrap}
:root[dir=rtl] .link{letter-spacing:0;font-size:14px;text-transform:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 30px;border-radius:2px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:.25s}
:root[dir=rtl] .btn{letter-spacing:0;font-size:15px;text-transform:none}
.btn.p{background:var(--gold);color:var(--black)}.btn.p:hover{background:var(--gold-l)}
.btn.k{background:var(--black);color:var(--ivory)}.btn.k:hover{background:#2a241d}
.btn.o{border:1px solid currentColor}.btn.o:hover{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.dark .btn.o:hover{background:var(--ivory);color:var(--black);border-color:var(--ivory)}

.ann{background:var(--black);color:var(--gold-l);font-size:12.5px;letter-spacing:.07em;text-align:center;padding:9px 12px}
.ann span+span::before{content:"·";margin-inline:14px;opacity:.6}
header{position:sticky;top:0;z-index:20;background:rgba(250,246,238,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:82px;gap:24px}
.nav ul{list-style:none;display:flex;gap:30px;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
:root[dir=rtl] .nav ul{letter-spacing:0;font-size:15px;text-transform:none}
.nav li a{position:relative;padding-block:6px}.nav li a:after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:var(--gold);transform:scaleX(0);transition:.3s}.nav li a:hover:after{transform:scaleX(1)}
.nav li.hot a{color:var(--gold-d);font-weight:600}
.logo img{height:46px;width:auto}
.tools{display:flex;justify-content:flex-end;gap:18px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;font-size:12px}.lang button{padding:6px 12px;color:var(--mute)}.lang button.on{background:var(--black);color:var(--ivory)}
.ic{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.5}
.cartbtn{position:relative}.cartbtn b{position:absolute;top:-8px;inset-inline-end:-10px;background:var(--gold);color:var(--black);font-size:10px;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center}
.menu{display:none}

/* hero — dark stage (from B) inside an ivory page (from A) */
.dark{background:var(--black);color:#EFE5D3}.dark h1,.dark h2,.dark h3{color:#F6EEDF}
.hero{background:radial-gradient(ellipse at 72% 38%,#2b2118 0%,#0E0C0A 64%);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;min-height:min(80vh,740px);padding-block:48px}
.hero h1{font-size:clamp(46px,6vw,88px);margin:16px 0 0}.hero h1 em{font-style:italic;color:var(--gold-l);font-weight:500}:root[dir=rtl] .hero h1 em{font-style:normal}
.hero .lead{font-size:18px;color:#B9AD9B;max-width:46ch;margin-top:6px}
.cta{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap}
.micro{margin-top:22px;font-size:13px;color:#9C917F;display:flex;gap:18px;flex-wrap:wrap}.micro span:before{content:"✓ ";color:var(--gold)}
.arch{justify-self:center;width:min(100%,560px);aspect-ratio:.9;border-radius:999px 999px 6px 6px;overflow:hidden;box-shadow:0 0 0 1px rgba(201,164,106,.55),0 0 0 14px #0E0C0A,0 0 0 15px rgba(201,164,106,.3),0 40px 90px -30px #000}
.arch img{width:100%;height:100%;object-fit:cover;object-position:52% 60%}
.trust{border-block:1px solid var(--line);background:var(--sand)}
.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-block:22px}
.trust div{display:flex;gap:14px;align-items:center;font-size:13.5px;line-height:1.35}
.trust svg{flex:none;width:30px;height:30px;stroke:var(--gold-d);fill:none;stroke-width:1.3}.trust b{display:block;font-weight:600}.trust span{color:var(--mute);font-size:12.5px}
/* brands */
.brands{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px;padding:16px 26px 16px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);transition:.25s}.brand:hover{border-color:var(--gold)}
:root[dir=rtl] .brand{padding:16px 16px 16px 26px}
.brand img{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#f2f2f2}.brand b{font-family:var(--serif);font-size:24px;font-weight:600;display:block;line-height:1.1}.brand span{font-size:12.5px;color:var(--mute)}
.brand.soon{border-style:dashed;background:transparent;color:var(--mute);padding:26px 30px;font-size:14px}

/* notes finder (dark) */
.finder{position:relative;overflow:hidden}.finder:before{content:"";position:absolute;inset-inline-end:-120px;top:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(201,164,106,.16),transparent 65%)}
.finder .grid{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(32px,5vw,80px);align-items:start;position:relative}
.finder .eyebrow{color:var(--gold-l)}.finder p.lead{color:#B9AD9B;margin-top:6px;max-width:44ch}
.step{margin-top:28px}.step h4{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-l);font-weight:500;margin-bottom:6px}:root[dir=rtl] .step h4{letter-spacing:0;font-size:14px;text-transform:none}
.step small{display:block;color:#9C917F;font-size:13px;margin-bottom:12px}
.notes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nt{text-align:start;padding:14px 14px 13px;border:1px solid rgba(239,229,211,.2);border-radius:var(--r);transition:.2s;color:#EFE5D3;display:flex;flex-direction:column;gap:3px;position:relative}
.nt b{font-weight:600;font-size:15px}.nt span{font-size:11.5px;color:#9C917F;line-height:1.35}.nt i{position:absolute;top:12px;inset-inline-end:12px;width:10px;height:10px;border-radius:50%;background:var(--dot)}
.nt:hover{border-color:var(--gold)}.nt.on{background:var(--gold);border-color:var(--gold);color:var(--black)}.nt.on span{color:#4a3a1c}.nt[disabled]{opacity:.35;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{padding:10px 18px;border:1px solid rgba(239,229,211,.28);border-radius:99px;font-size:14px;transition:.2s;color:#EFE5D3}.chip:hover{border-color:var(--gold)}.chip.on{background:var(--gold);color:var(--black);border-color:var(--gold)}
.picked{margin-bottom:14px;font-size:13px;color:#9C917F;min-height:20px}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.res{background:rgba(255,255,255,.05);border:1px solid rgba(239,229,211,.15);border-radius:var(--r);padding:12px 12px 16px;transition:.3s;display:flex;flex-direction:column}.res:hover{transform:translateY(-4px);border-color:var(--gold)}
.res img{border-radius:2px;aspect-ratio:1;object-fit:cover;width:100%}.res h3{font-size:26px;margin:12px 0 4px}
.tier{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l);font-weight:600}:root[dir=rtl] .tier{letter-spacing:0;font-size:13px;text-transform:none}
.mt{font-size:12.5px;color:#9C917F;margin:6px 0 2px}.shared{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px}.shared em{font-style:normal;font-size:11.5px;padding:3px 9px;border-radius:99px;background:rgba(226,194,125,.17);color:#F0DDB8}
.res .pr{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:15px}.res .pr button{font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--gold);padding-bottom:2px}:root[dir=rtl] .res .pr button{letter-spacing:0;font-size:13.5px;text-transform:none}
.honest{margin-top:18px;display:flex;gap:10px;font-size:12.5px;color:#A89C8A;border-top:1px solid rgba(239,229,211,.15);padding-top:14px;line-height:1.5}
.honest:before{content:"i";flex:none;width:18px;height:18px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--gold-l);font-style:italic;font-family:serif}
.empty{color:#9C917F;padding:40px 12px;border:1px dashed rgba(239,229,211,.25);border-radius:var(--r);text-align:center}

/* catalogue */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.cat{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:var(--r);background:var(--sand)}.cat img{width:100%;height:100%;object-fit:cover;transition:transform .8s}.cat:hover img{transform:scale(1.05)}
.cat:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(14,12,10,.72))}
.cat div{position:absolute;inset-inline:22px;bottom:20px;z-index:1;color:#fff}.cat h3{color:#fff;font-size:28px}.cat span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.9}:root[dir=rtl] .cat span{letter-spacing:0;font-size:13px;text-transform:none}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{padding:8px 16px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;transition:.2s}.filters button:hover{border-color:var(--gold)}.filters button.on{background:var(--black);color:var(--ivory);border-color:var(--black)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 22px}
.card .ph{position:relative;display:block;aspect-ratio:1;background:var(--sand);overflow:hidden;border-radius:var(--r)}.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s}.card:hover .ph img{transform:scale(1.05)}
.badge{position:absolute;top:12px;inset-inline-start:12px;background:var(--black);color:var(--gold-l);font-size:11.5px;padding:3px 9px;border-radius:99px;font-weight:600}
.card .bn{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);margin-top:14px;font-weight:500}:root[dir=rtl] .card .bn{letter-spacing:0;font-size:12.5px;text-transform:none}
.card h3{font-size:27px;margin-top:2px}.sub{font-size:12px;color:var(--mute);margin-top:2px}.nl{font-size:12.5px;color:var(--gold-d);margin-top:8px;min-height:19px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}.price b{font-size:19px;font-weight:600}.price small{font-size:12px;color:var(--mute)}.price s{font-size:13px;color:var(--mute);margin-inline-start:6px}
.add{font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--ink);padding:9px 14px;border-radius:2px;transition:.2s;white-space:nowrap}:root[dir=rtl] .add{letter-spacing:0;font-size:13.5px;text-transform:none}.add:hover{background:var(--ink);color:var(--ivory)}
.band{background:var(--sand)}.band .wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,96px);align-items:center}
.band p{opacity:.82;margin-top:6px;max-width:48ch}.why{display:grid;grid-template-columns:1fr 1fr;gap:22px 28px;margin-top:30px;border-top:1px solid var(--line);padding-top:26px}
.why b{display:block;font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:2px}.why span{font-size:13.5px;color:var(--mute)}
.band .pic{aspect-ratio:5/4;border-radius:var(--r);overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}.band .pic img{width:100%;height:100%;object-fit:cover}
.pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.pkg{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pkg img{aspect-ratio:1;object-fit:cover;width:100%}.pkg>div{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}.pkg h3{font-size:25px}.tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d);font-weight:600}:root[dir=rtl] .tag{letter-spacing:0;font-size:13px;text-transform:none}.pkg .add{margin-top:auto;align-self:flex-start}
footer{background:var(--black);color:#BFB3A0;padding-block:64px 28px;font-size:14px}footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:40px}
footer h5{color:#F4E8D8;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;margin-bottom:14px}:root[dir=rtl] footer h5{letter-spacing:0;font-size:14px;text-transform:none}
footer li{list-style:none;margin:8px 0}footer .flogo{height:46px;margin-bottom:14px}.pay{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(244,232,216,.25);padding:8px 14px;border-radius:99px;color:#F4E8D8;font-size:13px;margin-top:10px}
.legal{border-top:1px solid rgba(244,232,216,.12);margin-top:44px;padding-top:20px;font-size:12px;opacity:.7;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wa{position:fixed;inset-inline-end:20px;bottom:20px;z-index:30;background:#1FA855;color:#fff;border-radius:99px;padding:13px 20px;font-size:14px;font-weight:500;box-shadow:0 10px 30px -8px rgba(0,0,0,.4)}

/* cart drawer */
.scrim{position:fixed;inset:0;background:rgba(10,8,6,.6);opacity:0;pointer-events:none;transition:.3s;z-index:50}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(470px,100%);background:var(--ivory);z-index:60;transform:translateX(105%);transition:transform .35s;display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.5)}
:root[dir=rtl] .drawer:not(.on){transform:translateX(-105%)}.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}.dh h3{font-size:28px}.dh button{font-size:26px;line-height:1;color:var(--mute)}
.db{flex:1;overflow:auto;padding:8px 24px 20px}.li{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.li img{width:72px;height:72px;border-radius:var(--r);object-fit:cover}.li b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.15}.li small{color:var(--mute);font-size:12.5px}
.li .gift{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d);font-weight:600}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;margin-top:6px}.qty button{width:28px;height:28px;font-size:16px}.qty span{min-width:20px;text-align:center;font-size:13px}
.li .price s{display:block;font-size:12px}
.nudge{margin:14px 0 0;padding:11px 14px;background:var(--black);color:#F2E7D3;border-radius:var(--r);font-size:13.5px}.nudge b{color:var(--gold-l)}
.bar{height:3px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--goldline);background:var(--gold)}
.df{padding:18px 24px;border-top:1px solid var(--line);background:var(--sand)}
.tot{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:6px}.tot.big{color:var(--ink);font-size:18px;font-weight:600;margin-top:10px}.tot.promo{color:#2F6B3C}.tot.free span:last-child{color:#2F6B3C;font-weight:600}
.coupon{display:flex;gap:8px;margin-bottom:12px}.coupon input{flex:1;min-width:0;font:inherit;padding:11px 12px;border:1px solid var(--line);background:#fff;border-radius:var(--r);text-transform:uppercase;letter-spacing:.06em}
.coupon button{padding:0 16px;border:1px solid var(--ink);border-radius:var(--r);font-size:13px}.cmsg{font-size:12.5px;margin:-6px 0 10px}.cmsg.ok{color:#2F6B3C}.cmsg.bad{color:#B3382C}
.codnote{display:flex;gap:10px;align-items:center;font-size:13px;background:var(--ivory);border:1px dashed var(--gold);border-radius:var(--r);padding:10px 12px;margin-block:12px}.btn.full{width:100%}
.field{margin-bottom:14px}.field label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:var(--r);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field.err input,.field.err select,.field.err textarea{border-color:#B3382C}.field .em{display:none;color:#B3382C;font-size:12px;margin-top:4px}.field.err .em{display:block}
.done{text-align:center;padding:36px 4px}.done .ok{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;margin:0 auto 18px;color:var(--gold-d);font-size:28px}.done h3{font-size:34px;margin-bottom:10px}.done p{color:var(--mute)}
.btn.wa2{background:#1FA855;color:#fff;margin-top:14px}
.toast{position:fixed;inset-inline-start:50%;bottom:28px;transform:translate(-50%,40px);background:var(--black);color:var(--gold-l);padding:11px 18px;border-radius:99px;font-size:13.5px;opacity:0;transition:.3s;z-index:90;pointer-events:none}:root[dir=rtl] .toast{transform:translate(50%,40px)}.toast.on{opacity:1;transform:translate(-50%,0)}:root[dir=rtl] .toast.on{transform:translate(50%,0)}

/* ===== admin dashboard prototype ===== */
#admin{display:none;min-height:100vh;background:#F3EEE4;font-family:'Inter',sans-serif}body.isadmin #admin{display:block}body.isadmin #store,body.isadmin .wa{display:none}
.ad-top{background:var(--black);color:#EFE5D3;padding:14px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}.ad-top img{height:30px}.ad-top .tabs{display:flex;gap:4px;margin-inline-start:18px}
.ad-top .tabs button{padding:8px 16px;border-radius:99px;font-size:14px;color:#BFB3A0}.ad-top .tabs button.on{background:var(--gold);color:var(--black);font-weight:600}.ad-top a{margin-inline-start:auto;font-size:13px;color:var(--gold-l);border-bottom:1px solid var(--gold)}
.ad{max-width:1180px;margin:0 auto;padding:28px}.ad h2{font-size:34px;margin-bottom:6px}.ad .hint{color:var(--mute);font-size:14px;margin-bottom:22px;max-width:70ch}
.ad .card2{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.ad .card2 .t{font-weight:600;font-size:15.5px}.ad .card2 .d{font-size:13px;color:var(--mute);margin-top:3px}.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--sand);color:var(--gold-d);margin-inline-end:6px;font-weight:600;letter-spacing:.03em}
.pill.code{background:var(--black);color:var(--gold-l)}.pill.off{background:#eee;color:#888}

 nd_free:'أضف <b>{n} دينار</b> للحصول على توصيل مجاني',nd_gift:'أضف <b>{n} دينار</b> للحصول على هدية مجانية',nd_tier:'أضف <b>{n} دينار</b> لتوفّر {p}٪',
 co:'بياناتك',name:'الاسم الكامل',phone:'رقم الموبايل',gov:'المحافظة',addr:'العنوان (المنطقة، الشارع، البناية)',note:'ملاحظات للتوصيل (اختياري)',place:'تأكيد الطلب',back:'رجوع',
 e_name:'الرجاء إدخال الاسم',e_phone:'أدخل رقم موبايل أردني، مثال 079 123 4567',e_addr:'الرجاء إدخال العنوان',
 ok:'شكراً لك!',ok1:'وصلنا طلبك. سنتصل بك لتأكيد التفاصيل وموعد التوصيل.',ok2:'رقم الطلب',ok3:'الدفع نقداً عند الاستلام',ok_wa:'أرسل تفاصيل الطلب على واتساب',ok_wa_s:'اختياري — يساعدنا على التأكيد أسرع.',cont:'متابعة التسوق',added:'أُضيف إلى السلة'}};
const FAM_AR={citrus:['حمضيات','ليمون، برغموت، برتقال'],fruity:['فواكه','خوخ، كمثرى، تفاح، توت'],floral:['زهور','ورد، ياسمين، توبروز، زنبق'],sweet:['فانيلا وحلاوة','فانيلا، تونكا، عسل، كراميل'],woody:['خشب','صندل، أرز، باتشولي'],amber:['عنبر ومسك','عنبر، مسك'],spicy:['توابل','قرفة، فلفل، هيل، زعفران'],aromatic:['عشبي ومنعش','لافندر، أوكالبتوس، شاي، بحري'],oud:['عود ودخان','عود، تبغ، بخور']};
const GOV={en:['Amman','Zarqa','Irbid','Aqaba','Balqa (Salt)','Madaba','Karak','Mafraq','Jerash','Ajloun','Tafilah',"Ma'an"],ar:['عمّان','الزرقاء','إربد','العقبة','البلقاء (السلط)','مادبا','الكرك','المفرق','جرش','عجلون','الطفيلة','معان']};
let lang='en',forV='any',colV='all',picked=[],cart=store.get('cart',{}),step='cart',code='',couponMsg='';
let RULES=store.get('rules',null)||SEED_RULES;const $=s=>document.querySelector(s);const t=k=>T[lang][k];
const num=n=>(Math.round(n*100)/100).toLocaleString(lang==='ar'?'ar-JO':'en-US',{maximumFractionDigits:2});
const rname=r=>lang==='ar'&&r.nameAr?r.nameAr:r.name;
const used=()=>store.get('uses',{});
const quote=()=>PromoEngine.price(cart,{products:PRODUCTS,rules:RULES,code,deliveryFee:DELIVERY_FEE,used:used()});
function applyLang(){const d=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.dataset.i18n;if(d[k]!==undefined)e.textContent=d[k]});
 document.querySelectorAll('[data-i18n-html]').forEach(e=>{e.innerHTML=d[e.dataset.i18nHtml]});
 $('#en').classList.toggle('on',lang==='en');$('#ar').classList.toggle('on',lang==='ar');renderAll()}
function renderAnn(){const fd=RULES.find(r=>r.active&&r.type==='free_delivery'&&!r.code);
 $('#ann').innerHTML=`<span>${lang==='ar'?'توصيل في نفس اليوم داخل عمّان':'Same-day delivery within Amman'}</span><span>${lang==='ar'?'الدفع عند الاستلام':'Cash on delivery'}</span>`+(fd?`<span>${lang==='ar'?'توصيل مجاني فوق '+num(fd.minSpend)+' دينار':'Free delivery over '+num(fd.minSpend)+' JOD'}</span>`:`<span>${lang==='ar'?'التوصيل ٣ دنانير':'Delivery 3 JOD'}</span>`)}
function renderAll(){renderAnn();renderNotes();renderResults();renderFilters();renderBest();renderDrawer();updateCount()}
/* ---- notes finder ---- */
const famName=f=>lang==='ar'?FAM_AR[f.id][0]:f.name,famHint=f=>lang==='ar'?FAM_AR[f.id][1]:f.hint;
function renderNotes(){$('#notesGrid').innerHTML=FAMILIES.map(f=>{const on=picked.includes(f.id),dis=!on&&picked.length>=3;return `<button class="nt ${on?'on':''}" data-f="${f.id}" ${dis?'disabled':''} style="--dot:${f.dot}"><i></i><b>${famName(f)}</b><span>${famHint(f)}</span></button>`}).join('');
 $('#cnt').textContent=picked.length+' / 3 '+t('f_cnt');document.querySelectorAll('.nt').forEach(b=>b.onclick=()=>{const id=b.dataset.f;picked=picked.includes(id)?picked.filter(x=>x!==id):[...picked,id];renderNotes();renderResults()})}
function famOf(note){const n=note.toLowerCase();return FAMILIES.filter(f=>f.kw.some(k=>n.includes(k))&&!(f.ex||[]).some(e=>n.includes(e))).map(f=>f.id)}
function score(p){const hits={};['top','heart','base'].forEach(lay=>p.notes[lay].forEach(n=>famOf(n).forEach(f=>{if(picked.includes(f))(hits[f]=hits[f]||[]).push({n,w:lay==='top'?.6:1})})));return{m:Object.keys(hits).length,w:Object.values(hits).flat().reduce((a,x)=>a+x.w,0),hits}}
function renderResults(){const n=picked.length;$('#honest').textContent=t('f_honest');
 if(!n){$('#picked').textContent='';$('#results').innerHTML=`<div class="empty" style="grid-column:1/-1">${t('f_none')}</div>`;return}
 const list=Object.values(PRODUCTS).filter(p=>p.notes&&(forV==='any'||p.for==='unisex'||p.for===forV)).map(p=>({p,...score(p)})).filter(x=>x.m>0).sort((a,b)=>b.m-a.m||b.w-a.w).slice(0,3);
 $('#picked').textContent=t('f_picked')+': '+picked.map(id=>famName(FAMILIES.find(f=>f.id===id))).join(' · ');
 $('#results').innerHTML=list.map(x=>{const tier=x.m===n?t('f_best'):x.m===n-1?t('f_close'):t('f_part');const shared=[...new Set(Object.values(x.hits).flat().map(h=>h.n))];
  return `<div class="res"><img src="${x.p.img}" alt=""><div><span class="tier">${tier}</span><h3>${x.p.name}</h3></div><p class="mt">${x.m} ${t('f_of')} ${n} ${t('f_notes')}</p><div class="shared">${shared.slice(0,5).map(s=>`<em>${s}</em>`).join('')}</div><div class="pr"><span><b>${x.p.price}</b> JOD</span><button data-add="${x.p.id}">${t('f_add')}</button></div></div>`}).join('')||`<div class="empty" style="grid-column:1/-1">—</div>`;bindAdd()}
/* ---- catalogue ---- */
function renderFilters(){$('#filters').innerHTML=['all','niche','selective'].map(c=>`<button class="${colV===c?'on':''}" data-c="${c}">${t(c)}</button>`).join('');document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{colV=b.dataset.c;renderFilters();renderBest()})}
function renderBest(){const ids=Object.keys(PRODUCTS).filter(id=>PRODUCTS[id].notes&&(colV==='all'||PRODUCTS[id].collection===colV)).slice(0,12);
 $('#best').innerHTML=ids.map(id=>{const p=PRODUCTS[id],disc=p.was?`-${Math.round((1-p.price/p.was)*100)}%`:'';const nl=p.notes?[...p.notes.top.slice(0,1),...p.notes.heart.slice(0,1),...p.notes.base.slice(0,1)].join(' · '):'';
 return `<article class="card"><a class="ph" href="#"><img src="${p.img}" alt="${p.name}">${disc?`<span class="badge">${disc}</span>`:''}</a><div class="bn">${BRANDS[p.brand].name}</div><h3>${p.name}</h3><p class="sub">${t(p.collection==='niche'?'extrait':'edp')} · ${p.ml} ml · ${t('for_'+p.for)}</p><p class="nl">${nl}</p><div class="row"><div class="price"><b>${p.price}</b> <small>JOD</small>${p.was?` <s>${p.was}</s>`:''}</div><button class="add" data-add="${p.id}">${t('add')}</button></div></article>`}).join('');bindAdd()}
document.querySelectorAll('.cat[data-col]').forEach(c=>c.onclick=()=>{colV=c.dataset.col;renderFilters();renderBest()});
function bindAdd(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addCart(b.dataset.add))}
/* ---- cart, promotions, guest checkout (cash on delivery) ---- */
function saveCart(){store.set('cart',cart)}
function addCart(id){cart[id]=(cart[id]||0)+1;saveCart();toast(t('added'));renderDrawer();updateCount()}
function updateCount(){$('#cc').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
function openDrawer(){$('#drawer').classList.add('on');$('#scrim').classList.add('on')}
function closeDrawer(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');if(step==='done'){cart={};saveCart();step='cart';code='';couponMsg='';renderDrawer();updateCount()}}
function nudgeHtml(q){const n=q.nudges.sort((a,b)=>a.need-b.need)[0];if(!n)return'';const key=n.kind==='free_delivery'?'nd_free':n.kind==='gift'?'nd_gift':'nd_tier';
 const msg=t(key).replace('{n}',num(n.need)).replace('{p}',n.pct||'');const pct=Math.max(4,Math.min(100,100*(q.subtotal-q.discount)/n.target));return `<div class="nudge">${msg}<div class="bar"><i style="width:${pct}%"></i></div></div>`}
function summary(q){let h=`<div class="tot"><span>${t('sub')}</span><span>${num(q.subtotal)} JOD</span></div>`;
 q.applied.filter(a=>!a.delivery&&a.type!=='gift').forEach(a=>{h+=`<div class="tot promo"><span>${rname(RULES.find(r=>r.id===a.id)||{name:a.name})}</span><span>− ${num(a.amount)} JOD</span></div>`});
 h+=q.delivery===0&&q.deliveryFee?`<div class="tot free"><span>${t('deliv')}</span><span>${t('free')} <s style="color:var(--mute);font-weight:400">${num(q.deliveryFee)}</s></span></div>`:`<div class="tot"><span>${t('deliv')}</span><span>${num(q.delivery)} JOD</span></div>`;
 return h+`<div class="tot big"><span>${t('total')}</span><span>${num(q.total)} JOD</span></div>`}
function renderDrawer(){const ids=Object.keys(cart);$('#dtitle').textContent=step==='details'?t('co'):step==='done'?'':t('cart');const b=$('#dbody'),f=$('#dfoot');
 if(step==='done'){const o=lastOrder;b.innerHTML=`<div class="done"><div class="ok">✓</div><h3>${t('ok')}</h3><p>${t('ok1')}</p><p style="margin-top:16px"><b>${t('ok2')}:</b> ${o.no}<br>${t('ok3')}</p><a class="btn wa2 full" target="_blank" href="${waLink(WA_NUMBER,orderText(o))}">${t('ok_wa')}</a><p style="font-size:12.5px;margin-top:8px">${t('ok_wa_s')}</p></div>`;f.innerHTML=`<button class="btn k full" id="cont">${t('cont')}</button>`;$('#cont').onclick=closeDrawer;return}
 if(!ids.length){b.innerHTML=`<p style="color:var(--mute);padding-top:20px">${t('empty')}</p>`;f.innerHTML='';return}
 const q=quote();
 if(step==='cart'){const gifts=q.gifts.map(g=>`<div class="li"><img src="${PRODUCTS[g].img}" alt=""><div><span class="gift">${t('gift')}</span><b>${PRODUCTS[g].name}</b></div><div class="price"><b>0</b> <small>JOD</small></div></div>`).join('');
  b.innerHTML=ids.map(id=>{const p=PRODUCTS[id],l=q.lines.find(x=>x.pid===id);return `<div class="li"><img src="${p.img}" alt=""><div><b>${p.name}</b><small>${BRANDS[p.brand].name} · ${p.ml} ml</small><div class="qty"><button data-q="${id}" data-d="-1">−</button><span>${cart[id]}</span><button data-q="${id}" data-d="1">+</button></div></div><div class="price">${l.discount>0?`<s>${num(l.gross)}</s>`:''}<b>${num(l.net)}</b> <small>JOD</small></div></div>`}).join('')+gifts+nudgeHtml(q);
  f.innerHTML=`<div class="coupon"><input id="cin" placeholder="${t('coupon')}" value="${code}"><button id="cap">${t('apply')}</button></div>${couponMsg?`<div class="cmsg ${q.couponOk?'ok':'bad'}">${q.couponOk?t('c_ok'):t('c_bad')}</div>`:''}`+summary(q)+`<div class="codnote">💵 ${t('cod1')}</div><button class="btn k full" id="go">${t('checkout')}</button>`;
  document.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{const id=x.dataset.q;cart[id]+=+x.dataset.d;if(cart[id]<=0)delete cart[id];saveCart();updateCount();renderDrawer()});
  $('#cap').onclick=()=>{code=$('#cin').value.trim();couponMsg=code?'x':'';renderDrawer()};$('#go').onclick=()=>{step='details';renderDrawer()}}
 else{b.innerHTML=`<form id="frm" novalidate style="padding-top:18px"><div class="field" id="f1"><label>${t('name')}</label><input name="n" autocomplete="name"><div class="em">${t('e_name')}</div></div>
  <div class="field" id="f2"><label>${t('phone')}</label><input name="p" inputmode="tel" autocomplete="tel" placeholder="07X XXX XXXX" dir="ltr"><div class="em">${t('e_phone')}</div></div>
  <div class="field"><label>${t('gov')}</label><select name="g">${GOV[lang].map(g=>`<option>${g}</option>`).join('')}</select></div>
  <div class="field" id="f3"><label>${t('addr')}</label><textarea name="a" rows="2"></textarea><div class="em">${t('e_addr')}</div></div>
  <div class="field"><label>${t('note')}</label><input name="x"></div><div class="codnote">💵 ${t('cod1')}</div></form>`;
  f.innerHTML=summary(q)+`<div style="display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:12px"><button class="btn o" id="bk">${t('back')}</button><button class="btn k" id="pl">${t('place')}</button></div>`;
  $('#bk').onclick=()=>{step='cart';renderDrawer()};
  $('#pl').onclick=()=>{const fm=$('#frm'),ok=(id,v)=>{$(id).classList.toggle('err',!v);return v};
   const a=ok('#f1',fm.n.value.trim().length>1),bb=ok('#f2',/^(\+?962|0)?7[789]\d{7}$/.test(fm.p.value.replace(/[\s-]/g,''))),c=ok('#f3',fm.a.value.trim().length>4);
   if(a&&bb&&c)placeOrder({name:fm.n.value.trim(),phone:fm.p.value.replace(/[\s-]/g,''),gov:GOV.en[fm.g.selectedIndex],address:fm.a.value.trim(),note:fm.x.value.trim()})}}}
/* ---- orders: saved in the system first (source of truth); WhatsApp is the optional fast lane ---- */
let lastOrder=null;
function normPhone(p){p=p.replace(/\D/g,'');if(p.startsWith('962'))return p;if(p.startsWith('0'))return '962'+p.slice(1);return '962'+p}
function orderText(o){const L=o.lines.map(l=>`• ${PRODUCTS[l.pid].name} × ${l.qty}`).join('\n')+o.gifts.map(g=>`\n• ${PRODUCTS[g].name} (gift)`).join('');
 return `Hello SCENTRO 👋\nOrder ${o.no}\n${L}\nTotal: ${o.total} JOD (cash on delivery, delivery ${o.delivery} JOD)\n${o.customer.name} · ${o.customer.phone}\n${o.customer.gov} — ${o.customer.address}`}
const waLink=(num,text)=>`https://wa.me/${num}?text=${encodeURIComponent(text)}`;
function placeOrder(customer){const q=quote(),no='SC-'+Math.floor(10000+Math.random()*89999);
 const o={no,at:new Date().toISOString(),status:'new',customer:{...customer,phone:normPhone(customer.phone)},lines:q.lines.map(l=>({pid:l.pid,qty:l.qty,net:l.net})),gifts:q.gifts,applied:q.applied.map(a=>({name:a.name,amount:a.amount})),subtotal:q.subtotal,discount:q.discount,delivery:q.delivery,total:q.total,code:q.couponOk?code:''};
 const orders=store.get('orders',[]);orders.unshift(o);store.set('orders',orders);
 const u=used();q.applied.forEach(a=>u[a.id]=(u[a.id]||0)+1);store.set('uses',u);
 lastOrder=o;step='done';renderDrawer()}
/* ---- misc ---- */
$('#cartbtn').onclick=openDrawer;$('#dclose').onclick=closeDrawer;$('#scrim').onclick=closeDrawer;
$('#en').onclick=()=>{lang='en';applyLang()};$('#ar').onclick=()=>{lang='ar';applyLang()};
document.querySelectorAll('#forChips .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#forChips .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');forV=c.dataset.v;renderResults()});
$('#waFloat').href=waLink(WA_NUMBER,'Hello SCENTRO 👋');
{{ADMIN}}
/* ---- routing / demo hashes ---- */
function route(){const h=location.hash.replace('#','').split('-');document.body.classList.toggle('isadmin',h[0]==='admin');if(h[0]==='admin')renderAdmin(h[1]||adTab);}
window.addEventListener('hashchange',route);
const hs=location.hash.replace('#','').split('-');if(hs.includes('ar'))lang='ar';
if(hs.includes('demo'))picked=['sweet','woody','spicy'];
if(hs.includes('cart')||hs.includes('co')||hs.includes('promo')){const ids=Object.keys(PRODUCTS).filter(i=>PRODUCTS[i].collection==='niche');cart=hs.includes('promo')?{[ids[0]]:1,[ids[1]]:1,[ids[2]]:1}:{[ids[0]]:1,[ids[4]]:2}}
applyLang();route();
if(hs.includes('cart')||hs.includes('promo')){if(hs.includes('promo')){code='welcome10';couponMsg='x'}renderDrawer();openDrawer()}
if(hs.includes('co')){step='details';renderDrawer();openDrawer()}
</script>
