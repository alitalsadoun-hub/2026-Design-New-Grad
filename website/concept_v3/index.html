<style>
/* ===== SCENTRO identity: black · ivory · gold, classic serif (matches the wordmark) ===== */
:root{
  --ivory:#FAF6EE; --sand:#EFE7D8; --paper:#FFFFFF; --ink:#141210; --black:#0E0C0A; --black2:#17130F;
  --mute:#6F655A; --line:rgba(20,18,16,.13); --gold:#D3B66D; --gold-l:#E8D08E; --gold-d:#7A5B22;
  --goldline:linear-gradient(90deg,transparent,#C2A055 18%,#E3CB8A 50%,#C2A055 82%,transparent);
  --serif:'Cormorant Garamond','Amiri',serif; --sans:'Inter','IBM Plex Sans Arabic',system-ui,sans-serif; --r:3px;
}
:root[dir=rtl]{--serif:'Amiri','Cormorant Garamond',serif;--sans:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--ivory);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-inline:clamp(20px,4vw,56px)}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-d);font-weight:500}
:root[dir=rtl] .eyebrow{letter-spacing:.02em;font-size:13.5px;text-transform:none}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--ink);line-height:1.08;text-wrap:balance}
h2{font-size:clamp(32px,3.6vw,48px)}:root[dir=rtl] h1,:root[dir=rtl] h2,:root[dir=rtl] h3{line-height:1.3}
.rule{height:1px;background:var(--goldline);border:0;width:96px;margin:18px 0}
.sec{padding-block:clamp(56px,8vw,104px)}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:36px;flex-wrap:wrap}
.link{font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--gold);padding-bottom:3px;white-space:nowrap}
:root[dir=rtl] .link{letter-spacing:0;font-size:14px;text-transform:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 30px;border-radius:2px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:.25s}
:root[dir=rtl] .btn{letter-spacing:0;font-size:15px;text-transform:none}
.btn.p{background:var(--gold);color:var(--black)}.btn.p:hover{background:var(--gold-l)}
.btn.k{background:var(--black);color:var(--ivory)}.btn.k:hover{background:#2a241d}
.btn.o{border:1px solid currentColor}.btn.o:hover{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.dark .btn.o:hover{background:var(--ivory);color:var(--black);border-color:var(--ivory)}

.ann{background:var(--black);color:var(--gold-l);font-size:12.5px;letter-spacing:.07em;text-align:center;padding:9px 12px}
@media(max-width:700px){.ann span:nth-child(n+3){display:none}}
.ann span+span::before{content:"·";margin-inline:14px;opacity:.6}
header{position:sticky;top:0;z-index:20;background:rgba(250,246,238,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:82px;gap:24px}
.nav ul{list-style:none;display:flex;gap:30px;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
:root[dir=rtl] .nav ul{letter-spacing:0;font-size:15px;text-transform:none}
.nav li a{position:relative;padding-block:6px;display:inline-block;line-height:32px}.nav li a:after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:var(--gold);transform:scaleX(0);transition:.3s}.nav li a:hover:after{transform:scaleX(1)}
.nav li.hot a{color:var(--gold-d);font-weight:600}
.logo img{height:46px;width:auto}
.tools{display:flex;justify-content:flex-end;gap:18px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;font-size:12px}.lang button{padding:6px 12px;color:var(--mute)}.lang button.on{background:var(--black);color:var(--ivory)}
.ic{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.5}
.cartbtn{position:relative}.cartbtn b{position:absolute;top:-8px;inset-inline-end:-10px;background:var(--gold);color:var(--black);font-size:10px;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center}
.menu{display:none}

/* hero — dark stage (from B) inside an ivory page (from A) */
.dark{background:var(--black);color:#EFE5D3}.dark h1,.dark h2,.dark h3{color:#F6EEDF}
.hero{background:linear-gradient(115deg,#FBF7EF 0%,#EFE3CF 100%);position:relative;overflow:hidden}
.hero .wrap{display:grid;min-height:min(80vh,740px);align-items:center;padding-block:48px}.hero .copy{max-width:min(46%,560px);position:relative;z-index:2}
.hero h1{font-size:clamp(46px,6vw,88px);margin:16px 0 0}.hero h1 em{font-style:italic;color:var(--gold-d);font-weight:500}:root[dir=rtl] .hero h1 em{font-style:normal}
.hero .lead{font-size:18px;color:var(--mute);max-width:46ch;margin-top:6px}
.cta{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap}
.micro{margin-top:22px;font-size:13px;color:var(--mute);display:flex;gap:18px;flex-wrap:wrap}.micro span:before{content:"✓ ";color:var(--gold-d)}
.hero .art{position:absolute;inset-block:0;inset-inline-end:0;width:56%}.hero .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left center}
.hero .art:before{content:"";position:absolute;inset-block:0;inset-inline-start:-1px;width:9%;background:linear-gradient(90deg,#F4EADA,transparent);z-index:1}:root[dir=rtl] .hero .art:before{background:linear-gradient(270deg,#F4EADA,transparent)}
.trust{border-block:1px solid var(--line);background:var(--sand)}
.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-block:22px}
.trust div{display:flex;gap:14px;align-items:center;font-size:13.5px;line-height:1.35}
.trust svg{flex:none;width:30px;height:30px;stroke:var(--gold-d);fill:none;stroke-width:1.3}.trust b{display:block;font-weight:600}.trust span{color:var(--mute);font-size:12.5px}
/* brands */
.brands{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px;padding:16px 26px 16px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);transition:.25s}.brand:hover{border-color:var(--gold)}
:root[dir=rtl] .brand{padding:16px 16px 16px 26px}
.brand img{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#f2f2f2}.brand b{font-family:var(--serif);font-size:24px;font-weight:600;display:block;line-height:1.1}.brand span{font-size:12.5px;color:var(--mute)}
.brand.soon{border-style:dashed;background:transparent;color:var(--mute);padding:26px 30px;font-size:14px}

/* notes finder (dark) */
.finder{position:relative;overflow:hidden}.finder:before{content:"";position:absolute;inset-inline-end:-120px;top:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(201,164,106,.16),transparent 65%)}
.finder .grid{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(32px,5vw,80px);align-items:start;position:relative}
.finder .eyebrow{color:var(--gold-l)}.finder p.lead{color:#B9AD9B;margin-top:6px;max-width:44ch}
.step{margin-top:28px}.step h4{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-l);font-weight:500;margin-bottom:6px}:root[dir=rtl] .step h4{letter-spacing:0;font-size:14px;text-transform:none}
.step small{display:block;color:#9C917F;font-size:13px;margin-bottom:12px}
.notes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nt{text-align:start;padding:14px 14px 13px;border:1px solid rgba(239,229,211,.2);border-radius:var(--r);transition:.2s;color:#EFE5D3;display:flex;flex-direction:column;gap:3px;position:relative}
.nt b{font-weight:600;font-size:15px}.nt span{font-size:11.5px;color:#9C917F;line-height:1.35}.nt i{position:absolute;top:12px;inset-inline-end:12px;width:10px;height:10px;border-radius:50%;background:var(--dot)}
.nt:hover{border-color:var(--gold)}.nt.on{background:var(--gold);border-color:var(--gold);color:var(--black)}.nt.on span{color:#4a3a1c}.nt[disabled]{opacity:.35;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{padding:10px 18px;border:1px solid rgba(239,229,211,.28);border-radius:99px;font-size:14px;transition:.2s;color:#EFE5D3}.chip:hover{border-color:var(--gold)}.chip.on{background:var(--gold);color:var(--black);border-color:var(--gold)}
.picked{margin-bottom:14px;font-size:13px;color:#9C917F;min-height:20px}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.res{background:rgba(255,255,255,.05);border:1px solid rgba(239,229,211,.15);border-radius:var(--r);padding:12px 12px 16px;transition:.3s;display:flex;flex-direction:column}.res:hover{transform:translateY(-4px);border-color:var(--gold)}
.res img{border-radius:2px;aspect-ratio:1;object-fit:cover;width:100%}.res h3{font-size:26px;margin:12px 0 4px}
.tier{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l);font-weight:600}:root[dir=rtl] .tier{letter-spacing:0;font-size:13px;text-transform:none}
.mt{font-size:12.5px;color:#9C917F;margin:6px 0 2px}.shared{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px}.shared em{font-style:normal;font-size:11.5px;padding:3px 9px;border-radius:99px;background:rgba(226,194,125,.17);color:#F0DDB8}
.res .pr{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:15px}.res .pr button{font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--gold);padding-bottom:2px}:root[dir=rtl] .res .pr button{letter-spacing:0;font-size:13.5px;text-transform:none}
.honest{margin-top:18px;display:flex;gap:10px;font-size:12.5px;color:#A89C8A;border-top:1px solid rgba(239,229,211,.15);padding-top:14px;line-height:1.5}
.honest:before{content:"i";flex:none;width:18px;height:18px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--gold-l);font-style:italic;font-family:serif}
.empty{color:#9C917F;padding:40px 12px;border:1px dashed rgba(239,229,211,.25);border-radius:var(--r);text-align:center}

/* catalogue */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.cat{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:var(--r);background:var(--sand)}.cat img{width:100%;height:100%;object-fit:cover;transition:transform .8s}.cat:hover img{transform:scale(1.05)}
.cat:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(14,12,10,.72))}
.cat div{position:absolute;inset-inline:22px;bottom:20px;z-index:1;color:#fff}.cat h3{color:#fff;font-size:28px}.cat span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.9}:root[dir=rtl] .cat span{letter-spacing:0;font-size:13px;text-transform:none}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{padding:8px 16px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;transition:.2s}.filters button:hover{border-color:var(--gold)}.filters button.on{background:var(--black);color:var(--ivory);border-color:var(--black)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 22px}
.card .ph{position:relative;display:block;aspect-ratio:1;background:var(--sand);overflow:hidden;border-radius:var(--r)}.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s}.card:hover .ph img{transform:scale(1.05)}
.badge.so{background:#fff;color:var(--ink);border:1px solid var(--ink)}.lowq{font-size:12.5px;color:#8A3A1E;font-weight:600;margin-top:6px}
.badge{position:absolute;top:12px;inset-inline-start:12px;background:var(--black);color:var(--gold-l);font-size:11.5px;padding:3px 9px;border-radius:99px;font-weight:600}
.card .bn{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);margin-top:14px;font-weight:500}:root[dir=rtl] .card .bn{letter-spacing:0;font-size:12.5px;text-transform:none}
.card h3{font-size:27px;margin-top:2px}.sub{font-size:12px;color:var(--mute);margin-top:2px}.nl{font-size:12.5px;color:var(--gold-d);margin-top:8px;min-height:19px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}.price b{font-size:19px;font-weight:600}.price small{font-size:12px;color:var(--mute)}.price s{font-size:13px;color:var(--mute);margin-inline-start:6px}
.add{font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--ink);padding:9px 14px;border-radius:2px;transition:.2s;white-space:nowrap}:root[dir=rtl] .add{letter-spacing:0;font-size:13.5px;text-transform:none}.add:hover{background:var(--ink);color:var(--ivory)}
.band{background:var(--sand)}.band .wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,96px);align-items:center}
.band p{opacity:.82;margin-top:6px;max-width:48ch}.why{display:grid;grid-template-columns:1fr 1fr;gap:22px 28px;margin-top:30px;border-top:1px solid var(--line);padding-top:26px}
.why b{display:block;font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:2px}.why span{font-size:13.5px;color:var(--mute)}
.band .pic{aspect-ratio:5/4;border-radius:var(--r);overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}.band .pic img{width:100%;height:100%;object-fit:cover}
.pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.pkg{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pkg img{aspect-ratio:1;object-fit:cover;width:100%}.pkg>div{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}.pkg h3{font-size:25px}.tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d);font-weight:600}:root[dir=rtl] .tag{letter-spacing:0;font-size:13px;text-transform:none}.pkg .add{margin-top:auto;align-self:flex-start}
footer{background:var(--black);color:#BFB3A0;padding-block:64px 28px;font-size:14px}footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:40px}
footer h5{color:#F4E8D8;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;margin-bottom:14px}:root[dir=rtl] footer h5{letter-spacing:0;font-size:14px;text-transform:none}
footer li{list-style:none;margin:8px 0}footer .flogo{height:46px;margin-bottom:14px}.pay{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(244,232,216,.25);padding:8px 14px;border-radius:99px;color:#F4E8D8;font-size:13px;margin-top:10px}
.legal{border-top:1px solid rgba(244,232,216,.12);margin-top:44px;padding-top:20px;font-size:12px;opacity:.7;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wa{min-height:44px;display:inline-flex;align-items:center;position:fixed;inset-inline-end:20px;bottom:20px;z-index:30;background:#12703A;color:#fff;border-radius:99px;padding:13px 20px;font-size:14px;font-weight:500;box-shadow:0 10px 30px -8px rgba(0,0,0,.4)}

/* cart drawer */
.wm{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(14,12,10,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}.wm.on{display:flex;animation:wmin .35s ease}@keyframes wmin{from{opacity:0}to{opacity:1}}
.wc{position:relative;background:var(--ivory);border:1px solid var(--gold);border-radius:10px;width:min(560px,100%);max-height:94vh;overflow:auto;padding:30px 26px 22px;box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center}
.wc .wx{position:absolute;top:10px;inset-inline-end:10px;width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1;color:var(--ink)}.wc .wx:hover{background:var(--sand)}
.wc .we{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);font-weight:600}.wc h2{font-size:clamp(30px,6vw,40px);margin:8px 0 18px}
.wo{border:1px solid var(--line);background:#fff;border-radius:8px;padding:18px 16px;margin-bottom:12px;text-align:start}.wo.hot{border-color:var(--gold);background:linear-gradient(180deg,#FFFDF7,#FBF3DF)}
.wo .wt{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}.wo .wb{font-family:'Cormorant Garamond','Amiri',serif;font-size:clamp(30px,7vw,40px);line-height:1.1;margin:6px 0 4px;color:var(--ink)}:root[dir=rtl] .wo .wb{font-family:'Amiri',serif}
.wo .ws{font-size:14.5px;color:#4a4237;margin-bottom:10px}.wo .we2{display:inline-block;font-size:12px;background:var(--black);color:var(--gold-l);padding:3px 10px;border-radius:99px;margin-bottom:12px;font-weight:600}
.wo .btn{width:100%;justify-content:center}.wc .wf{font-size:13px;color:var(--mute);margin:6px 0 10px}.wc .wk{font-size:14px;color:var(--mute);text-decoration:underline;padding:8px 12px}
.scrim{position:fixed;inset:0;background:rgba(10,8,6,.6);opacity:0;pointer-events:none;transition:.3s;z-index:50}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(470px,100%);background:var(--ivory);z-index:60;transform:translateX(105%);transition:transform .35s;display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.5)}
:root[dir=rtl] .drawer:not(.on){transform:translateX(-105%)}.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}.dh h3{font-size:28px}.dh button{font-size:26px;line-height:1;color:var(--mute)}
.db{flex:1;overflow:auto;padding:8px 24px 20px}.li{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.li img{width:72px;height:72px;border-radius:var(--r);object-fit:cover}.li b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.15}.li small{color:var(--mute);font-size:12.5px}
.li .gift{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d);font-weight:600}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;margin-top:6px}.qty button{width:28px;height:28px;font-size:16px}.qty span{min-width:20px;text-align:center;font-size:13px}
.li .price s{display:block;font-size:12px}
.nudge{margin:14px 0 0;padding:11px 14px;background:var(--black);color:#F2E7D3;border-radius:var(--r);font-size:13.5px}.nudge b{color:var(--gold-l)}
.bar{height:3px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--goldline);background:var(--gold)}

 *
 * Every perfume is reduced to evidence items [note, weight]:
 *   heart / base notes = 1.0 · top notes = 0.6 · key notes of the original = 1.0 · accords (community-voted character) = 0.8
